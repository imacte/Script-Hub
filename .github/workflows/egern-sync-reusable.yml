name: Egern upstream sync worker

on:
  workflow_call:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository_owner == 'imacte'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted maintenance code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: imacte/Script-Hub
          ref: automation
          path: maintenance
          sparse-checkout: automation
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check synchronization logic
        run: node --test maintenance/automation/patches.test.mjs
      - name: Sync upstream and Egern resources
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_REPOSITORY: ${{ github.repository }}
        run: node maintenance/automation/sync-fork.mjs
